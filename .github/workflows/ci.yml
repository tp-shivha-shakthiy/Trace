name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trace
          POSTGRES_PASSWORD: trace
          POSTGRES_DB: trace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trace -d trace_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Node 22 ships with GitHub's ubuntu-latest runners; pin explicitly
      # anyway for reproducible builds.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build and typecheck frontend
        run: |
          npm ci --prefix frontend
          npm run typecheck --prefix frontend
          npm run build --prefix frontend

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app tests trace_schema.py serve.py

      - name: Verify frontend/dist exists
        run: |
          ls -la frontend/dist
          pwd
          echo "DIST_DIR check: $(test -d frontend/dist && echo EXISTS || echo MISSING)"

      - name: Run tests
        env:
          TRACE_TEST_DATABASE_URL: postgresql+psycopg://trace:trace@localhost:5432/trace_test
        run: pytest -vv --tb=short